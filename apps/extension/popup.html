<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; font: 13px system-ui, sans-serif; color: #111; }
    .wrap { padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    p { color: #555; line-height: 1.5; margin: 0 0 12px; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ddd; border-radius: 7px; font-size: 12px; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 7px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    .ok { color: #16a34a; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚡ Skove AI Apply</h1>
    <p>Open a job from your Skove dashboard and click <b>Pre-fill application form</b>. This extension fills the ATS form for you to review and submit.</p>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" placeholder="https://api-production-1bae.up.railway.app" />
    <button id="save">Save</button>
    <div class="ok" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
